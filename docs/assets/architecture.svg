<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Tractus Manus architecture</title>
  <desc id="desc">Webcam frames go to MediaPipe, then 47 features. A gesture engine drives Windows input. An optional trained classifier can select gestures. Training uses recorded landmarks.</desc>
  <rect width="1000" height="460" rx="18" fill="#0f172a"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="32" y="44" fill="#f8fafc" font-size="22" font-weight="600">Runtime path</text>
    <text x="32" y="292" fill="#f8fafc" font-size="22" font-weight="600">Optional personal classifier</text>
    <g>
      <rect x="30" y="72" width="150" height="78" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="105" y="106" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="600">Webcam</text>
      <text x="105" y="130" text-anchor="middle" fill="#94a3b8" font-size="13">local frame</text>
      <rect x="222" y="72" width="190" height="78" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="317" y="101" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">MediaPipe</text>
      <text x="317" y="123" text-anchor="middle" fill="#94a3b8" font-size="13">hand landmarker</text>
      <text x="317" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">21 points</text>
      <rect x="454" y="72" width="160" height="78" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="534" y="101" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">47 features</text>
      <text x="534" y="123" text-anchor="middle" fill="#94a3b8" font-size="13">position, scale</text>
      <text x="534" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">rotation invariant</text>
      <rect x="656" y="72" width="150" height="78" rx="10" fill="#111c33" stroke="#2dd4bf"/>
      <text x="731" y="101" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">Gesture engine</text>
      <text x="731" y="123" text-anchor="middle" fill="#94a3b8" font-size="13">geometric gates</text>
      <text x="731" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">classifier optional</text>
      <rect x="848" y="72" width="122" height="78" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="909" y="101" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">SendInput</text>
      <text x="909" y="123" text-anchor="middle" fill="#94a3b8" font-size="13">Windows</text>
      <text x="909" y="140" text-anchor="middle" fill="#94a3b8" font-size="13">cursor</text>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
      <path d="M180 111 L216 111"/>
      <path d="M412 111 L448 111"/>
      <path d="M614 111 L650 111"/>
      <path d="M806 111 L842 111"/>
    </g>
    <g>
      <rect x="30" y="330" width="190" height="78" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="125" y="359" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">Collector</text>
      <text x="125" y="381" text-anchor="middle" fill="#94a3b8" font-size="13">hand landmarks</text>
      <text x="125" y="398" text-anchor="middle" fill="#94a3b8" font-size="13">JSONL, no images</text>
      <rect x="262" y="330" width="180" height="78" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="352" y="359" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">Trainer</text>
      <text x="352" y="381" text-anchor="middle" fill="#94a3b8" font-size="13">PyTorch, CUDA</text>
      <text x="352" y="398" text-anchor="middle" fill="#94a3b8" font-size="13">5 model ensemble</text>
      <rect x="484" y="330" width="170" height="78" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="569" y="359" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">Model NPZ</text>
      <text x="569" y="381" text-anchor="middle" fill="#94a3b8" font-size="13">weights and</text>
      <text x="569" y="398" text-anchor="middle" fill="#94a3b8" font-size="13">class names</text>
      <rect x="696" y="330" width="274" height="78" rx="10" fill="#111c33" stroke="#334155"/>
      <text x="833" y="359" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">Runtime classifier</text>
      <text x="833" y="381" text-anchor="middle" fill="#94a3b8" font-size="13">NumPy inference</text>
      <text x="833" y="398" text-anchor="middle" fill="#94a3b8" font-size="13">smoothing and confidence threshold</text>
    </g>
    <g fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowTeal)">
      <path d="M220 369 L256 369"/>
      <path d="M442 369 L478 369"/>
      <path d="M654 369 L690 369"/>
      <path d="M833 330 L833 210 L731 210 L731 154" />
    </g>
    <text x="700" y="250" fill="#94a3b8" font-size="13">only if classifier.enabled is true</text>
  </g>
</svg>

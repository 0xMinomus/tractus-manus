[project]
name = "tractus-manus"
version = "1.0.1"
description = "Windows mouse control with hand gestures from a webcam."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.30,<0.11",
    "opencv-contrib-python>=4.10,<5",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
train = [
    "torch>=2.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
